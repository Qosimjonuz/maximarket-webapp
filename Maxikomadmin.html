<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxiMarket — Admin Panel</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5; color: #1a1a1a;
            margin: 0; padding: 16px; max-width: 600px; margin: 0 auto;
        }
        h1 { text-align: center; font-size: 22px; color: #1565c0; margin: 8px 0 20px; }
        .section {
            background: #fff; border-radius: 14px;
            padding: 18px; margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .section h2 { font-size: 16px; margin: 0 0 14px; color: #333; }
        label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 5px; color: #444; }
        input, textarea {
            width: 100%; padding: 11px 14px;
            border: 1.5px solid #e0e0e0; border-radius: 10px;
            font-size: 14px; font-family: inherit; background: #fafafa;
        }
        input:focus, textarea:focus { outline: none; border-color: #1565c0; background: #fff; }
        input[type="file"] { padding: 8px; background: #fff; cursor: pointer; }
        button {
            width: 100%; background: #1565c0; color: #fff;
            border: none; padding: 13px; border-radius: 10px;
            font-size: 15px; font-weight: 600; margin-top: 14px; cursor: pointer;
        }
        button:active { background: #0d47a1; }
        button:disabled { background: #90a4ae; }
        button.danger { background: #e53935; }
        button.small { width: auto; padding: 6px 12px; margin: 0; font-size: 12px; }
        .info-note {
            background: #e3f2fd; color: #1565c0;
            padding: 10px 12px; border-radius: 8px;
            font-size: 12px; margin: 10px 0; line-height: 1.5;
        }
        .image-preview {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 8px; margin-top: 8px;
        }
        .image-preview img {
            width: 100%; height: 70px; object-fit: cover;
            border-radius: 8px; border: 2px solid #e0e0e0;
        }
        .image-preview .empty {
            background: #f5f5f5; border: 2px dashed #ddd;
            border-radius: 8px; height: 70px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: #bbb;
        }
        .product-item {
            background: #f8f9fa; padding: 12px; border-radius: 10px;
            margin-bottom: 10px; display: flex; justify-content: space-between;
            align-items: center; gap: 8px;
        }
        .product-item-info { flex: 1; min-width: 0; }
        .product-item-info b { display: block; font-size: 14px; margin-bottom: 3px; word-break: break-word; }
        .product-item-info small { color: #777; font-size: 12px; display: block; }
        .status {
            text-align: center; padding: 10px; font-size: 13px;
            margin-top: 10px; border-radius: 8px; font-weight: 500;
        }
        .status.ok { background: #e8f5e9; color: #2e7d32; }
        .status.err { background: #ffebee; color: #c62828; }
        .hidden { display: none; }
        .loader {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid #fff; border-top-color: transparent;
            border-radius: 50%; animation: spin 0.7s linear infinite;
            vertical-align: middle; margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>🔐 MaxiMarket Admin Panel</h1>

    <div id="login-section" class="section">
        <h2>🔑 Kirish</h2>
        <label>Admin paroli</label>
        <input type="password" id="password-input" placeholder="Parolni kiriting">
        <button id="login-btn">Kirish</button>
        <div id="login-status" class="status"></div>
    </div>

    <div id="panel-section" class="hidden">
        <div class="section">
            <h2>➕ Yangi mahsulot qo'shish</h2>
            <div class="info-note">ℹ️ Chegirma avtomatik <b>12 soat</b>ga o'rnatiladi.</div>

            <label>Mahsulot nomi *</label>
            <input type="text" id="p-title" placeholder="Mahsulot nomi">

            <label>Tavsif</label>
            <textarea id="p-description" rows="4" placeholder="Har bir xususiyatni yangi qatorda yozing"></textarea>

            <label>Asl narxi (so'm) *</label>
            <input type="number" id="p-price" placeholder="199000" inputmode="numeric">

            <label>Chegirma narxi (so'm) *</label>
            <input type="number" id="p-discount" placeholder="99000" inputmode="numeric">

            <label>Ombordagi soni (dona)</label>
            <input type="number" id="p-stock" placeholder="10" inputmode="numeric">

            <label>📷 Rasmlar (4 tagacha)</label>
            <input type="file" id="p-images" accept="image/*" multiple>
            <div class="image-preview" id="image-preview">
                <div class="empty">📷</div>
                <div class="empty">📷</div>
                <div class="empty">📷</div>
                <div class="empty">📷</div>
            </div>

            <button id="add-btn">💾 Saqlash</button>
            <div id="add-status" class="status"></div>
        </div>

        <div class="section">
            <h2>📦 Mavjud mahsulotlar</h2>
            <div id="products-list">⏳ Yuklanmoqda...</div>
            <button id="refresh-btn">🔄 Yangilash</button>
        </div>

        <button class="danger" id="logout-btn">🚪 Chiqish</button>
    </div>

    <script>
        var API_URL = "https://maximarketbot-production.up.railway.app";
        var IMGBB_KEY = "11c314fa4eb34efe25677c6be08c5277";
        var adminPassword = "";
        var selectedFiles = [];

        // ============ LOGIN ============
        document.getElementById('login-btn').addEventListener('click', function() {
            var pwd = document.getElementById('password-input').value.trim();
            var status = document.getElementById('login-status');
            
            if (!pwd) {
                status.innerText = "Parolni kiriting!";
                status.className = "status err";
                return;
            }
            
            adminPassword = pwd;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('panel-section').classList.remove('hidden');
            loadProducts();
        });

        // Enter tugmasi bilan kirish
        document.getElementById('password-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('login-btn').click();
            }
        });

        // ============ LOGOUT ============
        document.getElementById('logout-btn').addEventListener('click', function() {
            adminPassword = "";
            selectedFiles = [];
            document.getElementById('password-input').value = "";
            document.getElementById('panel-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        });

        // ============ RASM PREVIEW ============
        document.getElementById('p-images').addEventListener('change', function(e) {
            selectedFiles = Array.from(e.target.files).slice(0, 4);
            var preview = document.getElementById('image-preview');
            preview.innerHTML = '';
            
            for (var i = 0; i < 4; i++) {
                if (selectedFiles[i]) {
                    (function(file) {
                        var reader = new FileReader();
                        reader.onload = function(ev) {
                            var img = document.createElement('img');
                            img.src = ev.target.result;
                            preview.appendChild(img);
                        };
                        reader.readAsDataURL(file);
                    })(selectedFiles[i]);
                } else {
                    var div = document.createElement('div');
                    div.className = 'empty';
                    div.innerText = '📷';
                    preview.appendChild(div);
                }
            }
        });

        // ============ IMGBB YUKLASH ============
        function uploadToImgBB(file, callback) {
            var formData = new FormData();
            formData.append('image', file);
            fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_KEY, {
                method: 'POST',
                body: formData
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.success && data.data && data.data.url) {
                    callback(data.data.url);
                } else {
                    callback(null);
                }
            })
            .catch(function() { callback(null); });
        }

        // ============ MAHSULOT QO'SHISH ============
        document.getElementById('add-btn').addEventListener('click', function() {
            var title = document.getElementById('p-title').value.trim();
            var description = document.getElementById('p-description').value.trim();
            var price = parseInt(document.getElementById('p-price').value) || 0;
            var discount = parseInt(document.getElementById('p-discount').value) || 0;
            var stock = parseInt(document.getElementById('p-stock').value) || 0;
            var statusEl = document.getElementById('add-status');
            var btn = document.getElementById('add-btn');

            if (!title || !price || !discount) {
                statusEl.innerText = "❗ Nomi, narx va chegirma narxini kiriting";
                statusEl.className = "status err";
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Saqlanmoqda...';
            statusEl.innerText = '';

            // Rasmlarni yuklash
            var imageUrls = [];
            var pending = selectedFiles.length;

            if (pending === 0) {
                sendProduct(imageUrls);
            } else {
                for (var i = 0; i < selectedFiles.length; i++) {
                    (function(idx) {
                        statusEl.innerText = '⏳ Rasm yuklanmoqda... (' + (idx+1) + '/' + pending + ')';
                        statusEl.className = "status ok";
                        uploadToImgBB(selectedFiles[idx], function(url) {
                            if (url) imageUrls.push(url);
                            if (idx === selectedFiles.length - 1 || imageUrls.length + (selectedFiles.length - idx - 1) === 0) {
                                // Oxirgi rasm
                                if (idx === selectedFiles.length - 1) sendProduct(imageUrls);
                            } else if (idx === selectedFiles.length - 1) {
                                sendProduct(imageUrls);
                            }
                        });
                    })(i);
                }
            }

            function sendProduct(urls) {
                fetch(API_URL + '/api/products', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        password: adminPassword,
                        title: title,
                        description: description,
                        price: price,
                        discount_price: discount,
                        stock: stock,
                        images: urls
                    })
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.success) {
                        statusEl.innerText = "✅ Mahsulot qo'shildi!";
                        statusEl.className = "status ok";
                        document.getElementById('p-title').value = '';
                        document.getElementById('p-description').value = '';
                        document.getElementById('p-price').value = '';
                        document.getElementById('p-discount').value = '';
                        document.getElementById('p-stock').value = '';
                        document.getElementById('p-images').value = '';
                        selectedFiles = [];
                        document.getElementById('image-preview').innerHTML = 
                            '<div class="empty">📷</div><div class="empty">📷</div><div class="empty">📷</div><div class="empty">📷</div>';
                        loadProducts();
                    } else {
                        statusEl.innerText = "❌ " + (data.error || "Xatolik");
                        statusEl.className = "status err";
                    }
                })
                .catch(function(err) {
                    statusEl.innerText = "❌ " + err.message;
                    statusEl.className = "status err";
                })
                .finally(function() {
                    btn.disabled = false;
                    btn.innerText = '💾 Saqlash';
                });
            }
        });

        // ============ MAHSULOTLAR RO'YXATI ============
        function loadProducts() {
            var list = document.getElementById('products-list');
            list.innerHTML = '⏳ Yuklanmoqda...';
            
            fetch(API_URL + '/api/products')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var products = data.products || [];
                if (products.length === 0) {
                    list.innerHTML = '<p style="color:#999;text-align:center;">Mahsulotlar yo\'q</p>';
                    return;
                }
                
                var html = '';
                products.forEach(function(p) {
                    html += '<div class="product-item">' +
                        '<div class="product-item-info">' +
                        '<b>' + (p.title || '') + '</b>' +
                        '<small>💰 ' + (p.discount_price || 0).toLocaleString() + ' so\'m | 📦 ' + (p.stock || 0) + ' dona</small>' +
                        '</div>' +
                        '<button class="danger small" data-id="' + p.id + '">🗑</button>' +
                        '</div>';
                });
                list.innerHTML = html;
                
                // O'chirish tugmalariga event
                var btns = list.querySelectorAll('button.danger');
                for (var i = 0; i < btns.length; i++) {
                    btns[i].addEventListener('click', function() {
                        var id = this.getAttribute('data-id');
                        if (confirm("Mahsulotni o'chirishni tasdiqlaysizmi?")) {
                            deleteProduct(id);
                        }
                    });
                }
            })
            .catch(function(err) {
                list.innerHTML = '<p style="color:#c62828;">Xatolik: ' + err.message + '</p>';
            });
        }

        // ============ O'CHIRISH ============
        function deleteProduct(id) {
            fetch(API_URL + '/api/products/' + id, {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ password: adminPassword })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.success) {
                    loadProducts();
                } else {
                    alert("Xatolik: " + (data.error || ""));
                }
            })
            .catch(function(err) {
                alert("Xatolik: " + err.message);
            });
        }

        // ============ YANGILASH ============
        document.getElementById('refresh-btn').addEventListener('click', loadProducts);
    </script>
</body>
</html>
