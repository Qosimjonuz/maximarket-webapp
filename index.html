<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MaxiMarket Do'koni</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header class="app-header">
        <div class="header-left">
            <img src="https://i.ibb.co/9k8t621d/IMG-20260916-104211-663.jpg" alt="MaxiMarket" class="logo-img" onerror="this.style.display='none'">
            <span class="brand-text">
                <span class="brand-maxi">Maxi</span><span class="brand-market">Market</span>
            </span>
        </div>
        <button class="profile-btn" onclick="openProfile()">
            <span>👤</span>
        </button>
    </header>

    <!-- BANNER -->
    <div class="banner-carousel" id="banner-carousel">
        <div class="banner-slide" id="banner-slide"></div>
        <button class="banner-nav prev" onclick="slideBanner(-1)">‹</button>
        <button class="banner-nav next" onclick="slideBanner(1)">›</button>
        <div class="banner-dots" id="banner-dots"></div>
    </div>

    <!-- QIDIRUV -->
    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Mahsulot qidirish..." oninput="filterProducts()">
        <button class="search-clear" id="search-clear" onclick="clearSearch()" style="display:none;">✕</button>
    </div>

    <!-- KATEGORIYALAR -->
    <div class="categories-scroll" id="categories-scroll"></div>

    <!-- MAHSULOTLAR -->
    <main id="products-container"></main>

    <!-- PROFIL OYNASI -->
    <div id="profile-modal" class="modal-overlay">
        <div class="modal-content profile-content">
            <button class="modal-close" onclick="closeProfile()">✕</button>
            <div class="profile-header-icon">
                <div class="profile-avatar" id="profile-avatar">👤</div>
            </div>
            <div class="profile-number" id="profile-number">#---</div>
            <div class="profile-form">
                <label>Ism Familiya</label>
                <input type="text" id="profile-fullname" placeholder="Ism Familiyangizni kiriting">
                <label>Telefon raqam</label>
                <input type="tel" id="profile-phone" placeholder="+998 90 000 00 00">
                <label>Profil rasmi (ixtiyoriy)</label>
                <input type="file" id="profile-photo" accept="image/*" onchange="previewProfilePhoto(event)">
                <label>Ro'yxatdan o'tgan sana</label>
                <input type="text" id="profile-date" readonly>
                <button class="save-btn" onclick="saveProfile()">💾 Saqlash</button>
                <div id="profile-status" class="status"></div>
            </div>
        </div>
    </div>

    <!-- BUYURTMA OYNASI -->
    <div id="order-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="slider">
                <button class="slider-btn prev" onclick="slideImage(-1)">‹</button>
                <img id="modal-image" src="" alt="Mahsulot rasmi">
                <button class="slider-btn next" onclick="slideImage(1)">›</button>
                <div class="slider-dots" id="slider-dots"></div>
            </div>
            <h2 id="modal-title"></h2>
            <div class="stock-badge" id="modal-stock"></div>
            <div id="modal-description" class="modal-description"></div>
            <p class="aksiya-badge">❗ AKSIYA NARXIDA ❗</p>
            <p class="modal-price">💵 <span id="modal-price"></span> SO'M</p>
            <p class="countdown-label">👉 Bugungi aksiya tugashiga</p>
            <div class="countdown">
                <div><span id="cd-hours">00</span><small>SOAT</small></div>
                <div><span id="cd-minutes">00</span><small>DAQIQA</small></div>
                <div><span id="cd-seconds">00</span><small>SONIYA</small></div>
            </div>
            <p class="info-label">Ma'lumotlaringizni yozib qoldiring ⬇️</p>
            <form id="order-form" onsubmit="submitOrder(event)">
                <label>ISMINGIZ *</label>
                <input type="text" id="order-name" placeholder="Ismingizni kiriting" required>
                <label>TELEFON RAQAMINGIZ *</label>
                <input type="tel" id="order-phone" placeholder="+998 90 000 00 00" value="+998 " required>
                <button type="submit" class="order-btn">🛒 Buyurtma berish</button>
            </form>
            <p class="delivery-info">📦 O'zbekiston bo'ylab yetkazib beramiz | Qo'lingizga olgach keyin to'lov qilasiz</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
