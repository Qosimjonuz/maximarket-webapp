<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <meta name="keywords" content="MaxiMarket, internet do'kon, onlayn xarid, arzon narxlar, chegirmalar, O'zbekiston, kiyim, elektronika, aksessuarlar">

    <!-- ==================== FAVICON (logotip) ==================== -->
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/9k8t621d/IMG-20260916-104211-663.jpg">
    <link rel="shortcut icon" type="image/jpeg" href="https://i.ibb.co/9k8t621d/IMG-20260916-104211-663.jpg">
    <link rel="apple-touch-icon" href="https://i.ibb.co/9k8t621d/IMG-20260916-104211-663.jpg">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/9k8t621d/IMG-20260916-104211-663.jpg">
    <link rel="mask-icon" href="https://i.ibb.co/9k8t621d/IMG-20260916-104211-663.jpg" color="#1565c0">

    <!-- ==================== OPEN GRAPH (ijtimoiy tarmoq) ==================== -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://maxi-market.uz/">
    <meta property="og:title" content="MaxiMarket — Arzon narxlar, sifatli mahsulotlar">
    <meta property="og:description" content="O'zbekiston bo'ylab sifatli mahsulotlar. Chegirmalar 70% gacha. Tez yetkazib berish.">
    <meta property="og:image" content="https://i.ibb.co/9k8t621d/IMG-20260916-104211-663.jpg">
    <meta property="og:site_name" content="MaxiMarket">
    <meta property="og:locale" content="uz_UZ">

    <!-- ==================== TWITTER ==================== -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MaxiMarket — Arzon narxlar">
    <meta name="twitter:description" content="O'zbekiston bo'ylab sifatli mahsulotlar">
    <meta name="twitter:image" content="https://i.ibb.co/9k8t621d/IMG-20260916-104211-663.jpg">

    <!-- ==================== TELEGRAM WEBAPP ==================== -->
    <meta name="telegram-webapp-title" content="MaxiMarket">
    <meta name="telegram-webapp-description" content="Internet do'kon">

    <!-- ==================== PERFORMANCE: Preconnect ==================== -->
    <link rel="preconnect" href="https://i.ibb.co" crossorigin>
    <link rel="dns-prefetch" href="https://i.ibb.co">
    <link rel="preconnect" href="https://telegram.org" crossorigin>
    <link rel="dns-prefetch" href="https://telegram.org">
    <link rel="preconnect" href="https://maximarketbot-production.up.railway.app" crossorigin>
    <link rel="dns-prefetch" href="https://maximarketbot-production.up.railway.app">

    <!-- ==================== PERFORMANCE: Preload ==================== -->
    <link rel="preload" href="https://telegram.org/js/telegram-web-app.js" as="script">
    <link rel="preload" href="https://i.ibb.co/9k8t621d/IMG-20260916-104211-663.jpg" as="image">
    <link rel="preload" href="style.css" as="style">
    <link rel="preload" href="app.js" as="script">

    <!-- ==================== SCRIPT: Telegram WebApp ==================== -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- ==================== STYLE ==================== -->
    <link rel="stylesheet" href="style.css">

    <!-- ==================== TARGET/PIXEL (keyin qo'shiladi) ==================== -->
    <!-- ⭐ Target.uz yoki Facebook Pixel kodini quyida qo'shing: -->
    <!--
    <script>
      // Target.uz kod
      // (keyinroq qo'shiladi)
    </script>
    -->
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <img src="https://i.ibb.co/9k8t621d/IMG-20260916-104211-663.jpg"
                 alt="MaxiMarket — Internet do'kon"
                 class="logo-img"
                 width="38"
                 height="38"
                 onerror="this.style.display='none'">
            <span class="brand-text">
                <span class="brand-maxi">Maxi</span><span class="brand-market">Market</span>
            </span>
        </div>
        <button class="profile-btn" onclick="openProfile()" aria-label="Profil">
            <span>👤</span>
        </button>
    </header>

    <div class="banner-carousel" id="banner-carousel">
        <div class="banner-slide" id="banner-slide"></div>
        <button class="banner-nav prev" onclick="slideBanner(-1)" aria-label="Oldingi">‹</button>
        <button class="banner-nav next" onclick="slideBanner(1)" aria-label="Keyingi">›</button>
        <div class="banner-dots" id="banner-dots"></div>
    </div>

    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Mahsulot qidirish..." oninput="filterProducts()">
        <button class="search-clear" id="search-clear" onclick="clearSearch()" style="display:none;">✕</button>
    </div>

    <div class="categories-scroll" id="categories-scroll"></div>

    <main id="products-container"></main>

    <!-- PROFIL OYNASI -->
    <div id="profile-modal" class="modal-overlay">
        <div class="modal-content profile-content">
            <button class="modal-close" onclick="closeProfile()">✕</button>
            <div class="profile-header-icon">
                <div class="profile-avatar" id="profile-avatar">👤</div>
            </div>
            <div class="profile-number" id="profile-number">#---</div>
            <div class="profile-form">
                <label>Ism Familiya</label>
                <input type="text" id="profile-fullname" placeholder="Ism Familiyangizni kiriting">
                <label>Telefon raqam</label>
                <input type="tel" id="profile-phone" placeholder="+998 90 000 00 00">
                <label>Profil rasmi (ixtiyoriy)</label>
                <input type="file" id="profile-photo" accept="image/*" onchange="previewProfilePhoto(event)">
                <label>Ro'yxatdan o'tgan sana</label>
                <input type="text" id="profile-date" readonly>
                <button class="save-btn" onclick="saveProfile()">💾 Saqlash</button>
                <div id="profile-status" class="status"></div>
            </div>
        </div>
    </div>

    <!-- BUYURTMA OYNASI -->
    <div id="order-modal" class="modal-overlay">
        <div class="order-modal-content">
            <div class="order-modal-header">
                <button class="back-btn" onclick="closeModal()">←</button>
                <div class="order-modal-title">Buyurtma berish</div>
                <div class="header-spacer"></div>
            </div>

            <div class="order-modal-body">
                <form id="order-form" onsubmit="submitOrder(event)">
                    <div class="countdown-block">
                        <p class="countdown-label">⏰ Aksiya tugashiga:</p>
                        <div class="countdown">
                            <div><span id="cd-days">03</span><small>KUN</small></div>
                            <div><span id="cd-hours">00</span><small>SOAT</small></div>
                            <div><span id="cd-minutes">00</span><small>DAQIQA</small></div>
                            <div><span id="cd-seconds">00</span><small>SONIYA</small></div>
                        </div>
                    </div>

                    <label class="form-label">To'liq ismi sharif *</label>
                    <input type="text" id="order-name" placeholder="To'liq ismi sharif" required minlength="4">

                    <label class="form-label">Telefon raqamingiz *</label>
                    <input type="tel" id="order-phone" placeholder="+998(__)-___-__-__" required>

                    <div id="size-section" class="order-option-section" style="display:none;">
                        <div class="option-label">📏 O'lchamni tanlang:</div>
                        <div class="option-list" id="modal-sizes"></div>
                    </div>

                    <div id="color-section" class="order-option-section" style="display:none;">
                        <div class="option-label">🎨 Rangni tanlang:</div>
                        <div class="option-list" id="modal-colors"></div>
                    </div>

                    <div id="order-status" class="status"></div>

                    <button type="submit" class="order-submit-btn">Tasdiqlash</button>

                    <div class="slider">
                        <div class="modal-img-wrap" id="modal-img-wrap">
                            <div class="modal-img-spinner"></div>
                            <img id="modal-image" src="" alt="Mahsulot rasmi" decoding="async">
                        </div>
                        <div class="slider-controls">
                            <button type="button" class="slider-btn prev" onclick="slideImage(-1)">‹</button>
                            <div class="slider-dots" id="slider-dots"></div>
                            <button type="button" class="slider-btn next" onclick="slideImage(1)">›</button>
                        </div>
                    </div>

                    <h2 id="modal-title" class="order-title"></h2>

                    <div class="order-price-block">
                        <span class="order-old-price" id="modal-old-price"></span>
                        <span class="order-new-price"><span id="modal-price"></span> so'm</span>
                        <span class="order-discount-badge" id="modal-discount-badge"></span>
                    </div>

                    <div class="order-stats">
                        <div class="stat-item">
                            <span class="stat-icon">📦</span>
                            <span class="stat-text">Omborda: <b id="modal-stock">0</b> dona</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-icon">✅</span>
                            <span class="stat-text">Sotilgan: <b id="modal-sold">0</b> dona</span>
                        </div>
                    </div>

                    <div id="modal-description" class="order-description"></div>

                    <p class="delivery-info">📦 O'zbekiston bo'ylab yetkazib beramiz | Qo'lingizga olgach keyin to'lov qilasiz</p>
                </form>
            </div>

            <div class="order-bottom-menu">
                <button type="button" onclick="closeModal()">
                    <span class="bottom-icon">🏠</span>
                    <span class="bottom-label">Bosh sahifa</span>
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
