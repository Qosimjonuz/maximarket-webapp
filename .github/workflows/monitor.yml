name: Sayt monitoringi
on:
  schedule:
    - cron: "17 */3 * * *"   # har 3 soatda
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright o'rnatish
        run: |
          npm i --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Jonli tekshiruv
        id: check
        run: node tests/monitor/live.js 2>&1 | tee result.txt
        shell: bash -o pipefail {0}
      - name: Xato bo'lsa issue ochish (egasiga GitHub xabari keladi)
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.existsSync('result.txt') ? fs.readFileSync('result.txt', 'utf8') : '';
            const title = '🚨 Sayt monitoringi: xato topildi';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = 'Natija:\n```\n' + out.slice(-3000) + '\n```\nIsh: ' + run;
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 50 });
            const ex = open.data.find(i => i.title === title);
            if (ex) await github.rest.issues.createComment({ ...context.repo, issue_number: ex.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });
